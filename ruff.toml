line-length = 90
target-version = "py311"

# Markdown under docs/ contains illustrative Python snippets -- including the
# predecessor's broken classifier, quoted verbatim to explain what was wrong.
# Reformatting quoted evidence would defeat its purpose.
extend-exclude = ["docs/**/*.md"]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "D",    # pydocstyle
    "ANN",  # annotations
]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "ANN401", # Any is legitimate for provider payloads
    "B008",   # FastAPI Depends() in defaults is the framework idiom
]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
# Test bodies read better without per-method docstrings; the class and
# method names carry the intent, and dict(...) is idiomatic for kwargs.
"**/tests/**" = [
    "D100", "D101", "D102", "D103",
    "ANN001", "ANN003", "ANN201", "ANN202",
    "C408",
]
"**/__init__.py" = ["D104"]
