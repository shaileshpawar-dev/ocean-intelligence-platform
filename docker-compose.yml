# Local staging stack: what production is meant to look like, on one machine.
#
#   docker compose up -d db                     PostgreSQL + PostGIS
#   docker compose run --rm migrate             schema to head (one-shot)
#   docker compose up --build backend           the API (no ingestion at start-up)
#   docker compose --profile ui up              also builds the React dashboard
#
# Data loading is deliberately NOT part of starting the app. Ingestion,
# geometry import and satellite processing are separate one-shot jobs:
#
#   docker compose run --rm jobs python -m app.water.cli ingest --all
#   docker compose run --rm jobs python -m app.water.cli import-geometry --file ...
#   docker compose run --rm jobs python -m app.water.cli fetch-imagery
#
# A fresh container serves what is already in the database; it never rebuilds
# it. No secret is defined here: copy .env.example to .env first.

services:
  db:
    # PostGIS, not plain Postgres: the spatial queries are SQL.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-oip}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oip}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  # One-shot: bring the schema to head. Run before the first start and
  # after every deploy that carries a migration.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    profiles: ["jobs"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-oip}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-oip}
      ENVIRONMENT: ${ENVIRONMENT:-staging}
    command: ["python", "-m", "app.water.cli", "db", "upgrade"]
    volumes:
      - oipdata:/app/data

  # One-shot: ingestion, geometry import, satellite processing. Never part
  # of serving the application.
  jobs:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    profiles: ["jobs"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-oip}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-oip}
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      WATER_CACHE_DIR: /app/data/raw
      # External data credentials. All default to empty -- the platform
      # reports a source as unavailable rather than substituting fake data.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CDSE_USERNAME: ${CDSE_USERNAME:-}
      CDSE_PASSWORD: ${CDSE_PASSWORD:-}
      CDSE_CLIENT_ID: ${CDSE_CLIENT_ID:-}
      CDSE_CLIENT_SECRET: ${CDSE_CLIENT_SECRET:-}
      CMEMS_USERNAME: ${CMEMS_USERNAME:-}
      CMEMS_PASSWORD: ${CMEMS_PASSWORD:-}
      GFW_API_TOKEN: ${GFW_API_TOKEN:-}
    command: ["python", "-m", "app.water.cli", "health"]
    volumes:
      - oipdata:/app/data

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-oip}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-oip}
      # Empty on purpose: a container must not ingest 35 states at start-up.
      WATER_BOOTSTRAP_STATES: ${WATER_BOOTSTRAP_STATES:-}
      DEMO_MODE: ${DEMO_MODE:-true}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DETECTOR_BACKEND: ${DETECTOR_BACKEND:-mock}
      GEE_ENABLED: ${GEE_ENABLED:-false}
      GEE_PROJECT_ID: ${GEE_PROJECT_ID:-}
      GEE_SERVICE_ACCOUNT: ${GEE_SERVICE_ACCOUNT:-}
      # Mount the key read-only and point at the container path.
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      # External data credentials. All default to empty -- the platform
      # reports a source as unavailable rather than substituting fake data.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CDSE_USERNAME: ${CDSE_USERNAME:-}
      CDSE_PASSWORD: ${CDSE_PASSWORD:-}
      CDSE_CLIENT_ID: ${CDSE_CLIENT_ID:-}
      CDSE_CLIENT_SECRET: ${CDSE_CLIENT_SECRET:-}
      CMEMS_USERNAME: ${CMEMS_USERNAME:-}
      CMEMS_PASSWORD: ${CMEMS_PASSWORD:-}
      GFW_API_TOKEN: ${GFW_API_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - oipdata:/app/data
      # Mount a GEE service-account key read-only, outside the image:
      # - ${GEE_KEY_HOST_PATH:-/dev/null}:/run/secrets/gee-key.json:ro

  frontend:
    profiles: ["ui"]
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:80"

volumes:
  pgdata:
    name: oip_pgdata
    external: true
  oipdata:
    name: ocean-intelligence-platform_oipdata
    external: true
