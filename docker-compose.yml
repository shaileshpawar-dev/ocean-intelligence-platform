# Local development stack.
#
#   docker compose up --build          backend + Postgres
#   docker compose --profile ui up     also builds the React dashboard
#
# No secret is defined here. Copy .env.example to .env first; compose reads it.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-oip}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oip}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host by default; the backend reaches it over the
    # compose network. Uncomment to inspect with a local client.
    # ports:
    #   - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-oip}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-oip}
      DEMO_MODE: ${DEMO_MODE:-true}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DETECTOR_BACKEND: ${DETECTOR_BACKEND:-mock}
      GEE_ENABLED: ${GEE_ENABLED:-false}
      GEE_PROJECT_ID: ${GEE_PROJECT_ID:-}
      GEE_SERVICE_ACCOUNT: ${GEE_SERVICE_ACCOUNT:-}
      # Mount the key read-only and point at the container path.
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    ports:
      - "8000:8000"
    volumes:
      - oipdata:/app/data
      # Mount a GEE service-account key read-only, outside the image:
      # - ${GEE_KEY_HOST_PATH:-/dev/null}:/run/secrets/gee-key.json:ro

  frontend:
    profiles: ["ui"]
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:80"

volumes:
  pgdata:
  oipdata:
